name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild when the canonical content repo (maxinelevesque/writing) publishes.
  # Its publish workflow fires repository_dispatch with event_type content-updated.
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        # `npm run build` runs the content generator first (clones the writing
        # repo, writes the gitignored src/content/**, atproto.json, .well-known,
        # personas), then astro build.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Required so the .well-known/ dot-directory (site.standard.publication
          # verification file) is included — v5 defaults this to false, which
          # silently drops all hidden files from the deployed site.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
